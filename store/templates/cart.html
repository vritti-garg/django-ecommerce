<table class="table align-middle">
    <thead>
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Action</th> </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>
                {% if item.product.image %}
                <img src="{{ item.product.image.url }}" style="height: 50px; width: 50px; object-fit: cover; margin-right: 10px;">
                {% endif %}
                {{ item.product.name }}
            </td>
            <td>₹ {{ item.product.price }}</td>
            <td>{{ item.quantity }}</td>
            <td>₹ {{ item.total_price }}</td>
            <td>
                <a href="{% url 'remove_from_cart' item.id %}" class="btn btn-danger btn-sm">
                    Remove
                </a>
                <a href="{% url 'checkout' %}" class="btn btn-success btn-lg">Proceed to Checkout</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
